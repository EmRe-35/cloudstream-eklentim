name: Eklentiyi Derle ve Yayınla

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Kaynak kodu kontrol et
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "GITHUB ACTIONS KAYNAK KONTROLÜ"
          echo "=================================================="
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "GitHub SHA: ${GITHUB_SHA}"
          echo "Checkout HEAD: $(git rev-parse HEAD)"
          echo "Commit: $(git log -1 --oneline --decorate)"
          echo ""
          echo "Mevcut modüller:"
          ls -d */ | grep -i "Provider" || echo "Modül bulunamadı!"
          echo ""
          echo "Provider dosyaları:"
          find . -name "*Provider.kt" -not -path "*/node_modules/*"

      - name: CloudStream Gradle pluginini hazırla
        shell: bash
        run: |
          set -e
          rm -rf /tmp/cloudstream-gradle
          git clone --depth 1 https://github.com/recloudstream/gradle.git /tmp/cloudstream-gradle
          cd /tmp/cloudstream-gradle
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: Eklentileri derle
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "EKLENTİ DERLEME BAŞLIYOR"
          echo "=================================================="
          gradle make --no-daemon --stacktrace

      - name: plugins.json oluştur
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "PLUGINS.JSON OLUŞTURULUYOR"
          echo "=================================================="
          gradle makePluginsJson --no-daemon --stacktrace

      - name: Derlenen dosyaları hazırla
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "DERLENEN DOSYALAR"
          echo "=================================================="
          rm -rf /tmp/cs-out
          mkdir -p /tmp/cs-out
          find . -name "*.cs3" -exec cp {} /tmp/cs-out/ \;
          find . -name "plugins.json" -not -path "*/node_modules/*" -exec cp {} /tmp/cs-out/ \;
          echo ""
          echo "Oluşturulan dosyalar:"
          ls -lah /tmp/cs-out

      - name: Builds branchine yayınla
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "BUILDS BRANCH YAYINI"
          echo "=================================================="
          cd /tmp/cs-out
          if [ -z "$(find . -maxdepth 1 -type f -print -quit)" ]; then
            echo "HATA: .cs3 veya plugins.json oluşturulmadı."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan builds-temp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/cs-out/* .
          git add -A
          git commit -m "Otomatik derleme: ${{ github.sha }}"

          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds-temp:builds --force
