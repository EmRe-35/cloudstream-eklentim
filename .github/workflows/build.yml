name: Eklentiyi Derle ve Yayınla

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Kaynak kodu kontrol et
        shell: bash
        run: |
          set -e
          PROVIDER="HdFilmCehennemiProvider/src/main/kotlin/com/example/HdFilmCehennemiProvider.kt"
          echo "=================================================="
          echo "GITHUB ACTIONS KAYNAK KONTROLÜ"
          echo "=================================================="
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"
          echo "GitHub SHA:"
          echo "${GITHUB_SHA}"
          echo "Checkout HEAD:"
          git rev-parse HEAD
          echo "Commit:"
          git log -1 --oneline --decorate
          echo "Provider:"
          echo "${PROVIDER}"
          if [ ! -f "$PROVIDER" ]; then
            echo "HATA: Provider dosyası bulunamadı."
            exit 1
          fi
          echo ""
          echo "Provider satır sayısı:"
          wc -l "$PROVIDER"
          echo ""
          echo "Provider SHA256:"
          sha256sum "$PROVIDER"
          echo ""
          echo "=================================================="
          echo "2062. SATIR KONTROLÜ"
          echo "=================================================="
          if [ "$(wc -l < "$PROVIDER")" -ge 2062 ]; then
            sed -n '2045,2075p' "$PROVIDER"
          else
            echo "Bu dosyada 2062. satır yok."
          fi
          echo ""
          echo "=================================================="
          echo "newExtractorLink KONTROLÜ"
          echo "=================================================="
          NEW_EXTRACTOR_COUNT=$(grep -c "newExtractorLink" "$PROVIDER" || true)
          echo "Bulunan newExtractorLink sayısı: $NEW_EXTRACTOR_COUNT"
          if [ "$NEW_EXTRACTOR_COUNT" -ne 0 ]; then
            echo ""
            echo "HATA: Provider içinde newExtractorLink çağrısı bulundu."
            echo ""
            grep -n -B8 -A12 "newExtractorLink" "$PROVIDER" || true
            exit 1
          fi
          echo ""
          echo "OK: newExtractorLink çağrısı bulunamadı."

      - name: CloudStream Gradle pluginini hazırla
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "CLOUDSTREAM GRADLE PLUGIN"
          echo "=================================================="
          rm -rf /tmp/cloudstream-gradle
          git clone --depth 1 https://github.com/recloudstream/gradle.git /tmp/cloudstream-gradle
          cd /tmp/cloudstream-gradle
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: CloudStream API kontrolü
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "CLOUDSTREAM API KONTROLÜ"
          echo "=================================================="
          find ~/.m2/repository -path "*cloudstream3*" -type f | head -100

      - name: Gradle dependency kontrolü
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "DEPENDENCY KONTROLÜ"
          echo "=================================================="
          gradle :HdFilmCehennemiProvider:dependencies --configuration debugCompileClasspath --no-daemon --stacktrace

      - name: Eklentiyi derle
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "EKLENTİ DERLEME BAŞLIYOR"
          echo "=================================================="
          gradle make --no-daemon --stacktrace

      - name: plugins.json oluştur
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "PLUGINS.JSON OLUŞTURULUYOR"
          echo "=================================================="
          gradle makePluginsJson --no-daemon --stacktrace

      - name: Derlenen dosyaları hazırla
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "DERLENEN DOSYALAR"
          echo "=================================================="
          rm -rf /tmp/cs-out
          mkdir -p /tmp/cs-out
          find . -name "*.cs3" -exec cp {} /tmp/cs-out/ \;
          find . -name "plugins.json" -not -path "*/node_modules/*" -exec cp {} /tmp/cs-out/ \;
          echo ""
          echo "Oluşturulan dosyalar:"
          ls -lah /tmp/cs-out

      - name: Builds branchine yayınla
        shell: bash
        run: |
          set -e
          echo "=================================================="
          echo "BUILDS BRANCH YAYINI"
          echo "=================================================="
          cd /tmp/cs-out
          if [ -z "$(find . -maxdepth 1 -type f -print -quit)" ]; then
            echo "HATA: .cs3 veya plugins.json oluşturulmadı."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan builds-temp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/cs-out/* .
          git add -A
          git commit -m "Otomatik derleme: ${{ github.sha }}"

          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds-temp:builds --force
