name: Eklentiyi Derle ve Yayınla

permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. KODU ÇEK
      # ============================================================

      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # ============================================================
      # 2. CHECKOUT KONTROLÜ
      # ============================================================

      - name: Kaynak kodu kesin olarak kontrol et
        shell: bash
        run: |
          set -e

          PROVIDER="HdFilmCehennemiProvider/src/main/kotlin/com/example/HdFilmCehennemiProvider.kt"

          echo "=================================================="
          echo "CHECKOUT KONTROLÜ"
          echo "=================================================="

          echo ""
          echo "GitHub Actions SHA:"
          echo "${{ github.sha }}"

          echo ""
          echo "Checkout edilen SHA:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Provider:"
          echo "$PROVIDER"

          if [ ! -f "$PROVIDER" ]; then
            echo ""
            echo "HATA: Provider dosyası bulunamadı!"
            exit 1
          fi

          echo ""
          echo "Provider satır sayısı:"
          wc -l "$PROVIDER"

          echo ""
          echo "=================================================="
          echo "newExtractorLink KONTROLÜ"
          echo "=================================================="

          grep -n -B5 -A10 "newExtractorLink" "$PROVIDER" || true

          echo ""
          echo "=================================================="
          echo "SOURCE PARAMETRESİ KONTROLÜ"
          echo "=================================================="

          if grep -q "source = this.name" "$PROVIDER"; then
            echo "OK: source = this.name bulundu."
          else
            echo ""
            echo "HATA: source = this.name bulunamadı!"
            echo ""
            echo "Actions yanlış/eski provider dosyasını derliyor."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "PROVIDER SON 150 SATIR"
          echo "=================================================="

          tail -n 150 "$PROVIDER"

          echo ""
          echo "=================================================="
          echo "KAYNAK KOD KONTROLÜ TAMAMLANDI"
          echo "=================================================="


      # ============================================================
      # 3. JDK
      # ============================================================

      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. GRADLE
      # ============================================================

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"


      # ============================================================
      # 5. CLOUDSTREAM GRADLE PLUGIN
      # ============================================================

      - name: CloudStream Gradle pluginini hazırla
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLOUDSTREAM GRADLE PLUGIN"
          echo "=================================================="

          rm -rf /tmp/cloudstream-gradle

          git clone \
            --depth 1 \
            https://github.com/recloudstream/gradle.git \
            /tmp/cloudstream-gradle

          cd /tmp/cloudstream-gradle

          chmod +x gradlew

          ./gradlew \
            publishToMavenLocal \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Maven Local CloudStream dosyaları:"

          find "$HOME/.m2/repository/com/lagradost/cloudstream3" \
            -type f \
            2>/dev/null || true


      # ============================================================
      # 6. CLOUDSTREAM API KONTROLÜ
      # ============================================================

      - name: CloudStream API kontrolü
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLOUDSTREAM API"
          echo "=================================================="

          find "$HOME/.m2/repository" \
            -path "*cloudstream3*" \
            -type f \
            2>/dev/null \
            | head -100


      # ============================================================
      # 7. DEPENDENCY KONTROLÜ
      # ============================================================

      - name: Gradle dependency kontrolü
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "DEPENDENCIES"
          echo "=================================================="

          gradle \
            :HdFilmCehennemiProvider:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 8. TEMİZ DERLEME
      # ============================================================

      - name: Temiz derleme
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLEAN"
          echo "=================================================="

          gradle \
            clean \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=================================================="
          echo "EKLENTİ DERLEME BAŞLIYOR"
          echo "=================================================="

          gradle \
            make \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 9. PLUGINS.JSON
      # ============================================================

      - name: plugins.json üret
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "PLUGINS.JSON"
          echo "=================================================="

          gradle \
            makePluginsJson \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 10. BUILD DOSYALARINI TOPLA
      # ============================================================

      - name: Derlenen dosyaları hazırla
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD ÇIKTILARI"
          echo "=================================================="

          rm -rf /tmp/cs-out

          mkdir -p /tmp/cs-out

          find . \
            -name "*.cs3" \
            -exec cp {} /tmp/cs-out/ \;

          find . \
            -name "plugins.json" \
            -not -path "*/node_modules/*" \
            -exec cp {} /tmp/cs-out/ \;

          echo ""
          echo "Üretilen dosyalar:"

          ls -lah /tmp/cs-out

          echo ""

          if [ -z "$(find /tmp/cs-out -maxdepth 1 -type f -print -quit)" ]; then
            echo "HATA: Hiçbir .cs3 veya plugins.json oluşmadı."
            exit 1
          fi


      # ============================================================
      # 11. BUILDS BRANCH
      # ============================================================

      - name: Builds branch'ine yayınla
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILDS BRANCH YAYINI"
          echo "=================================================="

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout --orphan builds-temp

          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/cs-out/* .

          git add -A

          git commit \
            -m "Otomatik derleme: ${{ github.sha }}"

          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            builds-temp:builds \
            --force

          echo ""
          echo "=================================================="
          echo "YAYIN BAŞARILI"
          echo "=================================================="
