name: Eklentiyi Derle ve Yayınla

permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # KODU ÇEK
      # ============================================================
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # ============================================================
      # GERÇEK COMMIT VE DOSYA KONTROLÜ
      # ============================================================
      - name: Kaynak kodu doğrula
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GERÇEK CHECKOUT EDİLEN COMMIT"
          echo "=========================================="

          git rev-parse HEAD

          echo ""
          echo "=========================================="
          echo "ACTIONS COMMIT"
          echo "=========================================="

          echo "${{ github.sha }}"

          echo ""
          echo "=========================================="
          echo "BRANCH"
          echo "=========================================="

          git branch --show-current || true

          echo ""
          echo "=========================================="
          echo "PROVIDER DOSYA SATIR SAYISI"
          echo "=========================================="

          wc -l \
            HdFilmCehennemiProvider/src/main/kotlin/com/example/HdFilmCehennemiProvider.kt

          echo ""
          echo "=========================================="
          echo "PROVIDER DOSYASI"
          echo "=========================================="

          ls -lah \
            HdFilmCehennemiProvider/src/main/kotlin/com/example/HdFilmCehennemiProvider.kt

          echo ""
          echo "=========================================="
          echo "2040-2070 ARASI"
          echo "=========================================="

          nl -ba \
            HdFilmCehennemiProvider/src/main/kotlin/com/example/HdFilmCehennemiProvider.kt \
            | sed -n '2040,2070p'

          echo ""
          echo "=========================================="
          echo "TÜM newExtractorLink ÇAĞRILARI"
          echo "=========================================="

          grep -n \
            -B5 \
            -A12 \
            "newExtractorLink" \
            HdFilmCehennemiProvider/src/main/kotlin/com/example/HdFilmCehennemiProvider.kt \
            || true

      # ============================================================
      # JDK
      # ============================================================
      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # ============================================================
      # CLOUDSTREAM GRADLE PLUGIN
      # ============================================================
      - name: CloudStream Gradle pluginini hazırla
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLOUDSTREAM GRADLE PLUGIN"
          echo "=========================================="

          rm -rf /tmp/cloudstream-gradle

          git clone \
            --depth 1 \
            https://github.com/recloudstream/gradle.git \
            /tmp/cloudstream-gradle

          cd /tmp/cloudstream-gradle

          chmod +x gradlew

          echo ""
          echo "CloudStream Gradle plugin derleniyor..."

          ./gradlew \
            publishToMavenLocal \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "MAVEN LOCAL CLOUDSTREAM DOSYALARI"
          echo "=========================================="

          find "$HOME/.m2/repository/com/lagradost/cloudstream3" \
            -maxdepth 6 \
            -type f \
            2>/dev/null || true

      # ============================================================
      # CLOUDSTREAM API KONTROL
      # ============================================================
      - name: CloudStream API kontrolü
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLOUDSTREAM API"
          echo "=========================================="

          find "$HOME/.m2/repository" \
            -path "*cloudstream3*" \
            -type f \
            2>/dev/null \
            | head -100

      # ============================================================
      # GRADLE DEPENDENCY KONTROL
      # ============================================================
      - name: Gradle dependency kontrolü
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DEPENDENCY KONTROLÜ"
          echo "=========================================="

          gradle \
            :HdFilmCehennemiProvider:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            --stacktrace

      # ============================================================
      # DERLEME
      # ============================================================
      - name: Eklentileri derle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EKLENTİ DERLEME BAŞLIYOR"
          echo "=========================================="

          gradle \
            make \
            --no-daemon \
            --stacktrace

      # ============================================================
      # PLUGINS.JSON
      # ============================================================
      - name: plugins.json üret
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PLUGINS.JSON"
          echo "=========================================="

          gradle \
            makePluginsJson \
            --no-daemon \
            --stacktrace

      # ============================================================
      # BUILD ÇIKTILARINI TOPLA
      # ============================================================
      - name: Derlenen dosyaları hazırla
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ÇIKTILARI"
          echo "=========================================="

          rm -rf /tmp/cs-out
          mkdir -p /tmp/cs-out

          find . \
            -name "*.cs3" \
            -exec cp {} /tmp/cs-out/ \;

          find . \
            -name "plugins.json" \
            -not -path "*/node_modules/*" \
            -exec cp {} /tmp/cs-out/ \;

          echo ""
          echo "Üretilen dosyalar:"

          ls -lah /tmp/cs-out

      # ============================================================
      # BUILDS BRANCH
      # ============================================================
      - name: Builds branch'ine yayınla
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "YAYINLAMA"
          echo "=========================================="

          if [ -z "$(find /tmp/cs-out -maxdepth 1 -type f -print -quit)" ]; then
            echo "HATA: .cs3 veya plugins.json oluşturulmadı."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout --orphan builds-temp

          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/cs-out/* .

          git add -A

          git commit \
            -m "Otomatik derleme: ${{ github.sha }}"

          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            builds-temp:builds \
            --force

          echo ""
          echo "=========================================="
          echo "YAYINLAMA TAMAMLANDI"
          echo "=========================================="
